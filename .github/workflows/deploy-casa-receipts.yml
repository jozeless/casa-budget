name: Deploy CASA extract-receipt (manual)

# Must be merged into the default branch before GitHub exposes Run workflow.
# No push/pull_request/schedule trigger, and no user-selected source or project.
'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casa-extract-receipt-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only the reviewed workflow on main may deploy; other dispatch refs are skipped.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: casa-3-source
    steps:
      - name: Checkout exact CASA 3.0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jozeless/casa-budget
          ref: 284d5d7444f8df7d604a04c188ad52cbfc73aa7f
          path: casa-3-source
          persist-credentials: false

      - name: Verify source and function configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "284d5d7444f8df7d604a04c188ad52cbfc73aa7f"
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          config = tomllib.loads(Path('supabase/config.toml').read_text())
          assert set(config['functions']) == {'extract-receipt'}
          assert config['functions']['extract-receipt']['verify_jwt'] is False
          for name in (
              'supabase/functions/extract-receipt/index.ts',
              'supabase/functions/_shared/extractor.mjs',
              'supabase/functions/_shared/pdf-validation.mjs',
              'supabase/functions/_shared/receipt-core.js',
          ):
              assert Path(name).is_file(), f'Missing required file: {name}'
          PY

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.75.0

      - name: Deploy only extract-receipt via API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          # Reads the pinned config (verify_jwt=false); Auth is checked inside the function.
          # No --prune, SQL, secret updates, login, debug output or Docker deployment.
          supabase functions deploy extract-receipt --project-ref eyapzprqhendzpnepdtg --use-api
